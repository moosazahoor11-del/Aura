name: Build AURA APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'aura_flutter_starter_v0_8.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract Flutter project
        run: |
          unzip -o aura_flutter_starter_v0_8.zip -d extracted

      - name: Locate Flutter project
        shell: bash
        run: |
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/extracted" -name pubspec.yaml -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find pubspec.yaml in the ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Flutter project: $PROJECT_DIR"

      - name: Generate Android files
        run: |
          cd "$PROJECT_DIR"
          flutter create --platforms=android .

      - name: Get Flutter dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get
      - name: Get Flutter dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Fix unsupported color constants
        run: |
          sed -i 's/Colors\.white45/Colors.white54/g' "$PROJECT_DIR/lib/main.dart"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --debug
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-debug-apk
          path: extracted/**/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error